# Copy this file to remote_cadence.local.yaml and fill it locally.
# The local override is ignored by Git. Never commit passwords or private keys.
remote:
  host: null
  user: null
  port: 22
  identity_file: null
  work_root: /tmp/open-rfampdesigner
  ssh_bin: ssh
  scp_bin: scp
  connect_timeout_seconds: 10
  command_timeout_seconds: 300
  strict_host_key_checking: accept-new

cadence:
  ocean_bin: ocean
  spectre_bin: spectre
  ocean_nograph: true
  # Optional directory containing a user-installed Xvfb executable.
  xvfb_path: null
  display: null
  xauthority: null

# Optional, read by `bench pdk-inventory` only (docs/132). Leave out to keep the script defaults.
# All entries are absolute paths on the Cadence host.
# inventory:
#   extra_roots: [/home/IC/Desktop/tsmc]      # appended to the default search roots
#   pdk_roots: [/home/IC]                     # replaces the default search roots
#   cdslib_files: [/home/IC/cds.lib]          # extra cds.lib files to read
#   cds_prefixes: [/home/IC/cadence]          # Cadence install trees (their libraries are not PDKs)
#   skip_home: true                           # ignore cds.lib libraries below the login user's $HOME
